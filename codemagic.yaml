# Codemagic CI/CD configuration for Dashverse
# Web remains the root Next.js/Vercel app. Mobile builds live in apps/mobile.

workflows:
  android-debug:
    name: Android Installable Test APK
    max_build_duration: 45
    environment:
      node: 22
      vars:
        EXPO_PUBLIC: "true"
    # Automatic APK evidence for every main-branch change. Release workflows
    # remain manual in Codemagic so credentials and store releases are explicit.
    scripts:
      - name: Install root dependencies
        script: |
          npm ci
      - name: Install mobile dependencies
        script: |
          cd apps/mobile
          npm ci
      - name: Bundle game engine into mobile WebView asset
        script: |
          node apps/mobile/scripts/bundle-game-html.js
      - name: Generate Android native project
        script: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          bash scripts/patch-android.sh
      - name: Build installable test APK
        script: |
          cd apps/mobile/android
          ./gradlew assembleRelease
    artifacts:
      - apps/mobile/android/app/build/outputs/apk/release/*.apk
      - apps/mobile/android/app/build/reports/**/*

  android-release:
    name: Android Release AAB
    max_build_duration: 60
    environment:
      node: 22
      groups:
        - android_keystore_credentials
      vars:
        EXPO_PUBLIC: "true"
    scripts:
      - name: Install root dependencies
        script: |
          npm ci
      - name: Install mobile dependencies
        script: |
          cd apps/mobile
          npm ci
      - name: Bundle game engine into mobile WebView asset
        script: |
          node apps/mobile/scripts/bundle-game-html.js
      - name: Generate Android native project
        script: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          bash scripts/patch-android.sh
      - name: Build release AAB
        script: |
          cd apps/mobile/android
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          else
            echo "No Android keystore env found; building unsigned release bundle. Configure android_keystore_credentials before store release."
            ./gradlew bundleRelease
          fi
    artifacts:
      - apps/mobile/android/app/build/outputs/bundle/release/*.aab
      - apps/mobile/android/app/build/reports/**/*

  android-testing:
    name: Android → Play internal testing
    # The push-to-testing lane: signed AAB, uploaded to the Play internal
    # track with the account-wide google_play env group (the same
    # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS service account repfinder uses —
    # env groups are account-level in Codemagic). Upload self-skips when
    # the group is not attached, so the workflow doubles as a signed-AAB
    # builder. Start it manually or via scripts/trigger-codemagic-release.sh.
    max_build_duration: 60
    environment:
      node: 22
      android_signing:
        # Keystore uploaded in Codemagic UI → Code signing → Android, named
        # "dashverse" (the farm's dashverse-release.jks — NOT repfinder's
        # akey; the store identity is bound to the first uploaded signature).
        # Injects CM_KEYSTORE_PATH/_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD.
        - dashverse
      groups:
        - google_play
      vars:
        EXPO_PUBLIC: "true"
        PACKAGE_NAME: "com.dashverse.app"
        PLAY_TRACK: "internal"
    scripts:
      - name: Install root dependencies
        script: |
          npm ci
      - name: Install mobile dependencies
        script: |
          cd apps/mobile
          npm ci
      - name: Assign unique CI versionCode
        script: |
          # Play rejects reused versionCodes, and re-uploading the same one
          # fails with "Version code N has already been used". Local farm
          # builds use small manual numbers (1, 2, 3…); CI derives a
          # monotonically growing code from Codemagic's per-app build
          # counter so no CI build can ever collide with another.
          cd apps/mobile
          node -e "const fs=require('fs');const f='app.json';const j=JSON.parse(fs.readFileSync(f,'utf8'));j.expo.android.versionCode=100+$BUILD_NUMBER;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n');console.log('CI versionCode:',j.expo.android.versionCode)"
      - name: Bundle game engine into mobile WebView asset
        script: |
          node apps/mobile/scripts/bundle-game-html.js
      - name: Generate Android native project
        script: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --no-install
          bash scripts/patch-android.sh
      - name: Build signed release AAB
        script: |
          # Keystore sources, in order: the "dashverse" Code-signing entry
          # (android_signing injects CM_KEYSTORE_PATH), or a base64 CM_KEYSTORE
          # variable in the android_keystore_credentials group (API-creatable,
          # no UI upload needed).
          KS="$CM_KEYSTORE_PATH"
          if [ -z "$KS" ] && [ -n "${CM_KEYSTORE:-}" ]; then
            KS=/tmp/dashverse.keystore.jks
            echo "$CM_KEYSTORE" | base64 --decode > "$KS"
          fi
          if [ -z "$KS" ]; then
            echo "No keystore: attach the dashverse Code-signing entry or the android_keystore_credentials group" >&2
            exit 1
          fi
          cd apps/mobile/android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$KS" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
      - name: Upload AAB to Play internal testing
        script: |
          if [ -z "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            echo "google_play env group not attached — skipping Play upload (signed AAB artifact only)."
            exit 0
          fi
          set -e
          AAB="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          umask 077
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/play-sa.json
          fastlane supply \
            --package_name "$PACKAGE_NAME" \
            --json_key /tmp/play-sa.json \
            --track "$PLAY_TRACK" \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots \
            --aab "$AAB"
          rm -f /tmp/play-sa.json
    artifacts:
      - apps/mobile/android/app/build/outputs/bundle/release/*.aab
      - apps/mobile/android/app/build/reports/**/*

  ios-release:
    name: iOS Release IPA
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dashverse.app
      vars:
        EXPO_PUBLIC: "true"
    scripts:
      - name: Install root dependencies
        script: |
          npm ci
      - name: Install mobile dependencies
        script: |
          cd apps/mobile
          npm ci
      - name: Bundle game engine into mobile WebView asset
        script: |
          node apps/mobile/scripts/bundle-game-html.js
      - name: Generate iOS native project
        script: |
          cd apps/mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace apps/mobile/ios/Dashverse.xcworkspace \
            --scheme Dashverse
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - apps/mobile/ios/*.xcarchive

  release-both:
    name: "One-click: Build iOS (TestFlight) + Android (Play)"
    # Manual-start only (no push triggers — store releases are explicit).
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      groups:
        - android_keystore_credentials
        # Account-level groups (attach in Codemagic UI → Environment variables):
        #   app_store_connect — ASC issuer/key + DIST_CERT_PRIVATE_KEY (base64 PEM
        #     of the team distribution cert; same cert as repfinder — key is
        #     team-wide, the recipe below mints a com.dashverse.app profile).
        #   google_play — GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (fastlane supply).
        # Upload steps self-skip when a group is missing, so builds still work
        # before the groups are attached.
      vars:
        EXPO_PUBLIC: "true"
        BUNDLE_ID: "com.dashverse.app"
        PACKAGE_NAME: "com.dashverse.app"
        PLAY_TRACK: "internal"
    scripts:
      - name: Install root dependencies
        script: |
          npm ci
      - name: Install mobile dependencies
        script: |
          cd apps/mobile
          npm ci
      - name: Bundle game engine into mobile WebView asset
        script: |
          node apps/mobile/scripts/bundle-game-html.js
      - name: Generate native Android and iOS projects
        script: |
          cd apps/mobile
          npx expo prebuild --clean --no-install
          bash scripts/patch-android.sh
      - name: Build Android AAB
        script: |
          cd apps/mobile/android
          if [ -n "$CM_KEYSTORE_PATH" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"
          else
            echo "No Android keystore env found; building unsigned release bundle. Configure android_keystore_credentials before store release."
            ./gradlew bundleRelease
          fi
      - name: Upload AAB to Play testing track
        script: |
          if [ -n "${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            set -e
            echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/play-sa.json
            fastlane supply \
              --package_name "$PACKAGE_NAME" \
              --json_key /tmp/play-sa.json \
              --track "$PLAY_TRACK" \
              --skip_upload_metadata \
              --skip_upload_images \
              --skip_upload_screenshots \
              --aab apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            rm -f /tmp/play-sa.json
          else
            echo "google_play env group not attached — skipping Play upload (build artifacts only)."
          fi
      - name: Set up iOS code signing
        script: |
          # Custom signing (repfinder recipe): the managed ios_signing block only
          # consumes profiles from the team store and fails when none exist for
          # the bundle id. fetch-signing-files --create mints a fresh app_store
          # profile for com.dashverse.app via the ASC API and binds it to the
          # team distribution cert. = form is required for --private-key /
          # --certificate-key (values start with dashes). Never echo the key.
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "app_store_connect env group not attached — skipping iOS signing (Android-only release)."
            exit 0
          fi
          set -e
          export DIST_CERT_KEY="$(echo "$DIST_CERT_PRIVATE_KEY" | base64 --decode | awk '/BEGIN/{f=1} f{print}')"
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id="$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key="$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key="$DIST_CERT_KEY" \
            --create
          xcode-project use-profiles
      - name: Install CocoaPods
        script: |
          cd apps/mobile/ios
          pod install
      - name: Build iOS IPA
        script: |
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "No ASC env — skipping iOS build."
            exit 0
          fi
          xcode-project build-ipa \
            --workspace apps/mobile/ios/Dashverse.xcworkspace \
            --scheme Dashverse
      - name: Publish IPA to TestFlight
        script: |
          if [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "No ASC env — skipping TestFlight upload."
            exit 0
          fi
          ipa=$(ls build/ios/ipa/*.ipa | head -1)
          app-store-connect publish \
            --issuer-id="$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id="$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key="$APP_STORE_CONNECT_PRIVATE_KEY" \
            --wait-for-processing \
            "$ipa"
    artifacts:
      - apps/mobile/android/app/build/outputs/bundle/release/*.aab
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - apps/mobile/ios/*.xcarchive
