      type: 'stats',
      score: stats.score,
      coins: stats.coins,
      distance: stats.distance,

      lives: stats.lives,
      biome: stats.biome,

    window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'gameover',

      distance: typeof finalStats === 'object' && finalStats ? Math.max(0, Math.floor(finalStats.distance || 0)) : 0,
