  // Create engine
  var canvas = document.getElementById('gameCanvas');
  var engine = new window.GameEngine(canvas, 42, 'knight');

  // Stats callback → post back to React Native
  engine.onStatsUpdate = function(stats) {
    window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'stats',
      score: stats.score,
      coins: stats.coins,
      distance: stats.distance,
      health: stats.health,
      maxHealth: stats.maxHealth,
      lives: stats.lives,
      biome: stats.biome,
      fps: stats.fps,
      powerUps: stats.powerUps,
      maxCombo: stats.maxCombo || 0,
      comboCount: stats.comboCount || 0,
      enemiesDefeated: stats.enemiesDefeated || 0

  };

  engine.onGameOver = function(finalStats) {
    window.ReactNativeWebView && window.ReactNativeWebView.postMessage(JSON.stringify({
      type: 'gameover',
      score: typeof finalStats === 'object' && finalStats ? Math.max(0, Math.floor(finalStats.score || 0)) : 0,
      distance: typeof finalStats === 'object' && finalStats ? Math.max(0, Math.floor(finalStats.distance || 0)) : 0,
      coins: typeof finalStats === 'object' && finalStats ? Math.max(0, Math.floor(finalStats.coins || 0)) : 0,

  };
