<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08070c">
  <title>Dashverse — offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(120vmax 60vmax at 50% 120%, rgba(107, 56, 148, 0.35), transparent 60%),
        #08070c;
      color: #f4f2ed;
      font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 30rem; }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.32em;
      padding: 0.45em 1em;
      border: 1px solid rgba(255, 113, 102, 0.55);
      border-radius: 999px;
      color: #ff7166;
      text-shadow: 0 0 10px rgba(255, 113, 102, 0.6);
      margin: 0 0 1.6rem;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2.4rem, 9vw, 4.2rem);
      letter-spacing: 0.06em;
      color: #c7ff4d;
      text-shadow:
        0 0 14px rgba(199, 255, 77, 0.85),
        0 0 48px rgba(149, 112, 255, 0.55);
    }
    .tagline {
      margin: 0 0 1.8rem;
      font-size: 0.8rem;
      letter-spacing: 0.22em;
      color: #9570ff;
      text-shadow: 0 0 12px rgba(149, 112, 255, 0.6);
    }
    p.copy {
      margin: 0 0 0.9rem;
      line-height: 1.65;
      font-size: 0.95rem;
      color: rgba(244, 242, 237, 0.82);
    }
    button {
      margin-top: 1.4rem;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      color: #08070c;
      background: #c7ff4d;
      border: none;
      border-radius: 999px;
      padding: 0.8em 2em;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(199, 255, 77, 0.45);
    }
    button:active { transform: translateY(1px); }
    @media (prefers-reduced-motion: no-preference) {
      .badge { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.55; } }
    }
  </style>
</head>
<body>
  <main>
    <p class="badge">SIGNAL LOST</p>
    <h1>DASHVERSE</h1>
    <p class="tagline">OFFLINE — NO FAKE LOAD SCREEN</p>
    <p class="copy">You are offline right now, and this device has no cached copy of the run yet.</p>
    <p class="copy">Offline play needs one prior visit while online: open Dashverse once with a connection and it caches itself. Then the run keeps going anywhere.</p>
    <button type="button" onclick="location.reload()">RETRY CONNECTION</button>
  </main>
</body>
</html>
