  // src/game/rendering/ink-ninja.ts
  function drawInkNinja(ctx, width, height, pose) {
    const ink = "#0a0a0f";
    const fold = "#373044";
    const edge = "#8e799e";
    const lime = "#c7ff4d";
    const sx = width / 20;
    const sy = height / 30;
    const stride = Math.max(-2.5, Math.min(2.5, pose.stride ?? 0));
    const swing = Math.sin(Math.max(0, Math.min(1, pose.melee ?? 0)) * Math.PI);
    const tuck = Math.sin(Math.max(0, Math.min(1, pose.tumble ?? 0)) * Math.PI);
    const lean = pose.dashing ? 3 : pose.airborne ? 1.5 : swing * 1.5 + Math.abs(stride) * 0.35;
    const lift = pose.airborne ? -1 : pose.dashing ? 1 : Math.abs(stride) * 0.2;
    const path = (points) => {
      ctx.beginPath();
      points.forEach(([x, y], i) => i ? ctx.lineTo(x * sx, y * sy) : ctx.moveTo(x * sx, y * sy));
    };
    const poly = (color, points) => {
      ctx.fillStyle = color;
      path(points);
      ctx.closePath();
      ctx.fill();
    };
    const mark = (color, points, weight = 0.55) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = weight * Math.min(sx, sy);
      path(points);
      ctx.stroke();
    };
    const shift = (points, x = lean, y = lift) => points.map(([px, py]) => [px + x, py + y]);
    const reach = pose.dashing ? 23 : pose.airborne ? 17 : 11 + Math.abs(stride) * 2;
    const wave = stride * 0.6;
    poly(ink, shift([[8, 9], [1, 7], [-reach, 3 + wave], [-reach + 4, 7], [-reach - 2, 10], [1, 11], [9, 12]]));
    poly(lime, shift([[7, 9], [0, 8], [-reach, 4 + wave], [-reach + 5, 8], [-reach - 1, 9], [1, 10], [7, 11]]));
    poly(lime, shift([[3, 10], [-reach + 6, 12 - wave], [-reach + 10, 13], [-reach + 2, 16 - wave], [2, 12], [6, 11]]));
    mark(ink, shift([[-reach + 7, 7 + wave], [-2, 9], [3, 9]]), 0.7);
    const hip = [10, 18];
    let rearKnee = [5 - stride * 0.8, 23];
    let rearFoot = [4 - stride * 1.5, 29 - Math.max(0, stride)];
    let frontKnee = [14 + stride * 0.8, 23];
    let frontFoot = [15 + stride * 1.5, 29 - Math.max(0, -stride)];
    if (pose.airborne) {
      rearKnee = [3, 21];
      rearFoot = [-1, 25];
      frontKnee = [17, 20];
      frontFoot = [13, 29];
    }
    if (pose.dashing) {
      rearKnee = [1, 23];
      rearFoot = [-3, 27];
      frontKnee = [15, 23];
      frontFoot = [20, 28];
    }
    const leg = (knee, foot, rear) => {
      const [kx, ky] = knee, [fx, fy] = foot;
      poly(ink, [
        [hip[0] - 3, hip[1] - 1],
        [hip[0] + 3, hip[1]],
        [kx + 2.5, ky - 1],
        [fx + 1.5, fy - 2],
        [fx + 4, fy],
        [fx + 3.5, fy + 1],
        [fx - 2, fy + 1],
        [fx - 2, fy - 2],
        [kx - 2.5, ky + 2],
        [hip[0] - 4, hip[1] + 2]
      ]);
      poly(fold, [[hip[0] - 1, hip[1] + 1], [kx + 1, ky], [fx, fy - 2], [kx - 1, ky + 1]]);
      mark(rear ? fold : edge, [[hip[0] + 2, hip[1] + 1], [kx + 2.5, ky], [fx + 1.5, fy - 2]]);
      mark(edge, [[kx - 1.5, ky], [kx + 0.5, ky + 0.7]], 0.45);
    };
    leg(rearKnee, rearFoot, true);
    const rearShoulder = [7 + lean, 11 + lift];
    let rearElbow = [3 - stride, 15];
    let rearHand = [3 - stride * 1.3, 18];
    let frontElbow = [18 + stride * 0.6, 15];
    let frontHand = [17 + stride, 19];
    if (pose.airborne) {
      rearElbow = [2, 13];
      rearHand = [-1, 11];
      frontElbow = [20, 13];
      frontHand = [18, 9];
    }
    if (pose.dashing) {
      rearElbow = [0, 13];
      rearHand = [-4, 12];
      frontElbow = [11, 16];
      frontHand = [6, 17];
    }
    frontElbow = [frontElbow[0] + (21 - frontElbow[0]) * swing, frontElbow[1] + (11 - frontElbow[1]) * swing];
    frontHand = [frontHand[0] + (23 - frontHand[0]) * swing, frontHand[1] + (7 - frontHand[1]) * swing];
    const arm = (shoulder, elbow, hand, rear) => {
      const [ax, ay] = shoulder, [ex, ey] = elbow;
      const hx = hand[0] + (rear ? 2 : -2) * tuck, hy = hand[1] - 3 * tuck;
      poly(ink, [
        [ax - 2, ay - 1],
        [ax + 2, ay],
        [ex + 2, ey - 1],
        [hx + 2, hy - 1],
        [hx + 2, hy + 2],
        [hx - 1, hy + 3],
        [hx - 3, hy],
        [ex - 2, ey + 2],
        [ax - 3, ay + 2]
      ]);
      poly(fold, [[ax - 1, ay + 1], [ex + 1, ey], [hx, hy], [ex - 1, ey + 1]]);
      mark(rear ? fold : edge, [[ax + 1, ay], [ex + 2, ey], [hx + 1, hy]]);
      mark(edge, [[hx - 1, hy], [hx + 1, hy + 1]], 0.6);
    };
    arm(rearShoulder, rearElbow, rearHand, true);
    poly(ink, [[5 + lean, 11 + lift], [11 + lean, 9 + lift], [16 + lean, 12 + lift], [14, 17], [13, 20], [7, 20], [5, 16]]);
    poly(fold, [[6 + lean, 12 + lift], [12 + lean, 11 + lift], [13 + lean, 13], [9, 17], [7, 17]]);
    mark(edge, [[6 + lean, 11 + lift], [10 + lean, 10 + lift], [12 + lean, 10.5 + lift]]);
    mark(edge, [[13, 15], [9, 17], [12, 17.5]], 0.45);
    poly(fold, [[6, 18], [14, 17.5], [14, 19], [6, 20]]);
    poly(ink, [[7, 18.5], [10, 18], [10, 19.5], [8, 20.5]]);
    leg(frontKnee, frontFoot, false);
    arm([14 + lean, 12 + lift], frontElbow, frontHand, false);
    poly(fold, [[3, 19], [15 + lean, 7 + lift], [16 + lean, 8 + lift], [5, 21]]);
    mark(edge, [[4, 19], [14 + lean, 9 + lift]], 0.4);
    poly(ink, shift([
      [5, 4],
      [3, 0],
      [6, 1],
      [5, -3],
      [9, 0],
      [10, -4],
      [12, -1],
      [15, -3],
      [15, 0],
      [19, -2],
      [17, 2],
      [20, 1],
      [17, 5],
      [17, 8],
      [13, 11],
      [9, 10],
      [6, 7]
    ]));
    mark(edge, shift([[5, 0], [6, -2], [9, 1], [10, -3], [12, 0], [15, -2]]), 0.55);
    mark(edge, shift([[19, -1], [17, 2], [19, 2]]), 0.5);
    poly(fold, shift([[7, 5], [11, 6.5], [17, 4], [16, 7], [12, 9], [8, 8]]));
    poly(lime, shift([[8, 5.5], [11.5, 6.8], [11, 8], [9, 7.5]]));
    poly(lime, shift([[13, 6.5], [17, 4.8], [16, 7], [13, 8]]));
    poly(lime, shift([[6, 9], [10, 10.5], [16, 8.5], [14, 11], [9, 12], [5, 10.5]]));
    mark(ink, shift([[8, 10.5], [11, 11], [14, 10]]), 0.65);
  }

  // src/game/rendering/ink-cherry.ts
  function drawInkCherry(ctx, width, height, pose) {
    const ink = "#141019";
    const fold = "#3a2c42";
    const edge = "#a78bb0";
    const cherry = "#e5304a";
    const deep = "#8e1226";
    const stem = "#5a8f5a";
    const skin = "#f2e2da";
    const sx = width / 22;
    const sy = height / 32;
    const stride = Math.max(-2.5, Math.min(2.5, pose.stride ?? 0));
    const swing = Math.sin(Math.max(0, Math.min(1, pose.melee ?? 0)) * Math.PI);
    const tuck = Math.sin(Math.max(0, Math.min(1, pose.tumble ?? 0)) * Math.PI);
    const lean = pose.dashing ? 3 : pose.airborne ? 1.5 : swing * 1.5 + Math.abs(stride) * 0.35;
    const lift = pose.airborne ? -1 : pose.dashing ? 1 : Math.abs(stride) * 0.2;
    const poly = (color, points) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      points.forEach(([x, y], i) => i ? ctx.lineTo(x * sx, y * sy) : ctx.moveTo(x * sx, y * sy));
      ctx.closePath();
      ctx.fill();
    };
    const mark = (color, points, weight = 0.55) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = weight * Math.min(sx, sy);
      ctx.beginPath();
      points.forEach(([x, y], i) => i ? ctx.lineTo(x * sx, y * sy) : ctx.moveTo(x * sx, y * sy));
      ctx.stroke();
    };
    const shift = (points, x = lean, y = lift) => points.map(([px, py]) => [px + x, py + y]);
    const fruit = (color, x, y, r = 0.58) => {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x * sx, y * sy, r * Math.min(sx, sy), 0, Math.PI * 2);
      ctx.fill();
    };
    const ring = (color, x, y, r = 0.34, weight = 0.3) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = weight * Math.min(sx, sy);
      ctx.beginPath();
      ctx.arc(x * sx, y * sy, r * Math.min(sx, sy), 0, Math.PI * 2);
      ctx.stroke();
    };
    const cherryPair = (mx, my, dx = 0, dy = 0) => {
      const x = mx + dx, y = my + dy;
      mark(stem, [[x - 0.55, y + 0.05], [x, y - 0.5]], 0.4);
      mark(stem, [[x + 0.55, y + 0.15], [x, y - 0.5]], 0.4);
      fruit(cherry, x - 0.55, y + 0.35);
      fruit(cherry, x + 0.55, y + 0.45);
      ring("#cdd6e4", x, y - 0.5);
    };
    const reach = pose.dashing ? 17 : pose.airborne ? 12 : 8 + Math.abs(stride) * 1.6;
    const wave = stride * 0.5;
    poly(cherry, shift([[14.5, 4.5], [10, 3.5], [5, 4.5 + wave], [-0.5 - reach, 6 + wave], [3, 6.8], [9, 6.2], [14, 5.6]]));
    poly(deep, shift([[14, 4.9], [9, 4], [4.5, 4.9 + wave], [0, 6 + wave], [3.5, 6.3], [9, 5.7]]));
    poly(cherry, shift([[14, 7.5], [9, 6.8], [4, 8 - wave], [-1 - reach, 10.5 - wave], [2.5, 11.2], [8.5, 9.6], [13.6, 8.8]]));

      [13.5 - hemReach * 0.5, 32 + h2 + hemLift],

      [9.5 - hemReach * 0.5, 31.5 + h2 + hemLift],

      [5 - hemReach * 0.5, 29.5 + h2 + hemLift],
      [4, 22]
    ]));

    poly(blood, shift([[11.6, 15.4], [12.5, 14.6], [13.4, 15.4], [12.5, 16.4]]));
    mark(blood, shift([[12.5, 16.4], [12.5, 19]], 0), 0.35);
    const tipSway = -stride * 0.6 - (pose.dashing ? 3.5 : 0);
    poly(mat.deep, shift([
      [6 + lean, 13 + lift],
      [5 + lean, 6 + lift],
      [9.5 + lean + tipSway * 0.4, -1.5 + lift],
      [13 + lean + tipSway, 0.5 + lift],
      [16 + lean, 4.5 + lift],
      [19 + lean, 9 + lift],
      [18 + lean, 14.5 + lift],
      [12.5, 17],
      [7, 16]
    ]));
    poly(mat.ink, shift([[8, 8], [17, 8], [17.4, 13.4], [12.5, 15.6], [7.8, 13]]));
    poly(emberEye, shift([[9.7, 9.8], [11.7, 9.3], [11.2, 11.4], [9.6, 11.2]]));
    poly(emberEye, shift([[15.3, 9.8], [13.3, 9.3], [13.8, 11.4], [15.4, 11.2]]));
    if (pose.dashing) {
      mark(emberEye, [[8.4, 10.4], [5.5, 10.9]], 0.6);
      mark(emberEye, shift([[16.4, 10.4], [19 + lean, 10.9]], 0), 0.6);
    }
    const rearShoulder = [9 + lean, 16 + lift];
    let rearElbow = [5 - stride, 19.5];
    let rearHand = [5 - stride * 1.3, 23];
    let frontElbow = [18 + stride * 0.6, 18.5];
    let frontHand = [17 + stride, 22];
    if (pose.airborne) {
      rearElbow = [4, 16];
      rearHand = [1, 14];
      frontElbow = [20, 16];
      frontHand = [19, 12];
    }
    if (pose.dashing) {
      rearElbow = [2, 16];
      rearHand = [-2, 15];
      frontElbow = [14, 19];
      frontHand = [10, 21];
    }
    const arm = (shoulder, elbow, hand, rear) => {
      const [ax, ay] = shoulder, [ex, ey] = elbow;
      const hx = hand[0] + (rear ? 1.5 : -1.5) * tuck, hy = hand[1] - 2.5 * tuck;
      poly(mat.ink, [
        [ax - 1.8, ay - 1],
        [ax + 1.8, ay],
        [ex + 1.8, ey - 1],
        [hx + 1.4, hy - 1],
        [hx + 1.4, hy + 1.7],
        [hx - 1, hy + 2],
        [hx - 2.4, hy],
        [ex - 1.8, ey + 1.5],
        [ax - 2.5, ay + 1.5]
      ]);
      poly(mat.deep, [[ax - 0.8, ay + 0.8], [ex + 0.8, ey], [hx, hy], [ex - 0.8, ey + 0.8]]);
      mark(rear ? mat.fold : bone, [[ax + 0.8, ay], [ex + 1.6, ey], [hx + 0.8, hy]], 0.4);
      return [hx, hy];
    };
    arm(rearShoulder, rearElbow, rearHand, true);
    rearElbow = [rearElbow[0] + (11 - rearElbow[0]) * swing, rearElbow[1] + (17 - rearElbow[1]) * swing];
    rearHand = [rearHand[0] + (12 - rearHand[0]) * swing, rearHand[1] + (16 - rearHand[1]) * swing];
    frontElbow = [frontElbow[0] + (19 - frontElbow[0]) * swing, frontElbow[1] + (15 - frontElbow[1]) * swing];
    frontHand = [frontHand[0] + (18 - frontHand[0]) * swing, frontHand[1] + (14 - frontHand[1]) * swing];
    arm([16 + lean, 16 + lift], frontElbow, frontHand, false);
    arm([9 + lean, 16 + lift], rearElbow, rearHand, true);
    const gripLow = rearHand;
    let tip = [gripLow[0] + 11, gripLow[1] - 21];
    if (pose.airborne) tip = [gripLow[0] + 12, gripLow[1] - 22];
    if (pose.dashing) tip = [gripLow[0] - 3, gripLow[1] - 14];
    tip = [tip[0] + swing * 4, tip[1] + swing * 7];
    mark(mat.ink, [gripLow, [(gripLow[0] + tip[0]) / 2, (gripLow[1] + tip[1]) / 2], tip], 0.95);
    mark(mat.deep, [[gripLow[0] + 0.6, gripLow[1] - 0.2], [(gripLow[0] + tip[0]) / 2 + 0.6, (gripLow[1] + tip[1]) / 2 - 0.5], [tip[0] - 0.5, tip[1] + 1]], 0.4);
    const hdx = tip[0] - gripLow[0], hdy = tip[1] - gripLow[1];
    const hlen = Math.hypot(hdx, hdy) || 1;
    const dir = [hdx / hlen, hdy / hlen];
    let perp = [-dir[1], dir[0]];
    if (perp[0] < 0) perp = [-perp[0], -perp[1]];
    const along = (f, d) => [tip[0] + perp[0] * f + dir[0] * d, tip[1] + perp[1] * f + dir[1] * d];
    const b0 = tip;
    const b1 = along(3.2, 1.6);
    const b2 = along(6.6, 2.2);
    const b3 = along(7, -0.6);
    const b4 = along(5.4, -2.2);
    const b5 = along(2, -2);
    poly(bone, [b0, b1, b2, b3, b4, b5]);
    poly(blood, [along(1.2, 0.9), along(4.2, 1.6), along(5, -0.4), along(2.4, -1.2)]);
    mark(mat.ink, [b0, b1, b2], 0.4);
  };

    const center = width / 2;
    const headW = Math.max(13, width - 8);
    const head = resolveHeadPose(width, pose);
    const tumblePose = Math.max(0, Math.min(1, pose.tumble ?? 0));
    const tumbleArms = resolveTumbleArms(tumblePose);
    const headX = center - headW / 2 + head.offsetX;

      return;
    }
    if (char.id === "knight") {
      drawInkKnight(ctx, width, height, pose);
      ctx.restore();
      return;
    }

      drawInkCherry(ctx, width, height, pose);
      ctx.restore();
      return;
    }
    const rosterInk = {
      tank: drawInkTank,
      mage: drawInkMage,
      ranger: drawInkRanger,
      cyborg: drawInkCyborg,
      spirit: drawInkSpirit,
      healer: drawInkHealer,
      velvet: drawInkVelvet,
      ember: drawInkEmber,
      rosalia: drawInkRosalia,
      marionette: drawInkMarionette,
      dorian: drawInkDorian,
      onyx: drawInkOnyx,
      mortimer: drawInkMortimer,

      rect(ctx, "#991b1b", -11, 12, 9, 2);
    } else if (char.id === "knight") {

      ctx.moveTo(4, 15);
      ctx.lineTo(-5, 19);
      ctx.lineTo(3, height - 5);
      ctx.closePath();
      ctx.fill();
    } else if (char.id === "ranger") {
      rect(ctx, "#713f12", 0, 13, 4, height - 16);
    } else if (char.id === "mage") {
      ctx.fillStyle = "#4c1d95";
      ctx.beginPath();
      ctx.moveTo(center, -2);
      ctx.lineTo(1, 12);
      ctx.lineTo(width - 1, 12);

    rect(ctx, char.bodyColor, 4, torsoY, width - 8, torsoH - 1);
    rect(ctx, light, 5, torsoY + 1, Math.max(4, width - 13), 3);

    rect(
      ctx,
      dark,
      arms.rearArmX + tumbleArms.rearArmDx,
      arms.rearArmY + tumbleArms.rearArmDy,
      4,
      arms.rearArmH
    );
    rect(
      ctx,
      dark,
      arms.frontArmX + tumbleArms.frontArmDx,
      arms.frontArmY + tumbleArms.frontArmDy,
      4,
      arms.frontArmH
    );
    if (char.id === "tank") {
      rect(ctx, "#cbd5e1", 2, torsoY, width - 4, 4);
      rect(ctx, "#475569", -2, torsoY + 2, 6, 9);
      rect(ctx, "#475569", width - 4, torsoY + 2, 6, 9);
    } else if (char.id === "cyborg") {
      rect(ctx, "#0f172a", 4, torsoY + 3, width - 8, 3);
      rect(ctx, "#22d3ee", 6, torsoY + 4, width - 12, 1);
      rect(ctx, "#22d3ee", center - 2, torsoY + 8, 4, 4);
    } else if (char.id === "healer") {
      rect(ctx, "#ccfbf1", center - 1, torsoY + 2, 2, torsoH - 5);
      rect(ctx, "#ccfbf1", center - 5, torsoY + 6, 10, 2);
    } else if (char.id === "ranger") {
      rect(ctx, "#84cc16", 4, torsoY + 2, width - 8, 2);
      drawBow(
        ctx,
        arms.frontArmX + 5 + tumbleArms.frontArmDx,
        arms.frontArmY + 3 + tumbleArms.frontArmDy
      );
    } else if (char.id === "knight") {
      rect(ctx, "#fbbf24", center - 1, torsoY + 3, 2, torsoH - 4);
      drawSword(
        ctx,
        arms.frontArmX + 5 + tumbleArms.frontArmDx,
        arms.frontArmY - 1 + tumbleArms.frontArmDy
      );
    } else if (char.id === "ninja") {
      rect(ctx, "#111827", 4, torsoY, width - 8, torsoH - 1);
      rect(ctx, "#dc2626", 4, torsoY + 5, width - 8, 2);
    } else if (char.id === "mage") {
      rect(ctx, "#c084fc", center - 2, torsoY + 4, 4, 4);
    } else if (char.id === "spirit") {
      rect(ctx, "#ddd6fe", 5, torsoY + 2, width - 10, 2);
    }
    rect(ctx, dark, headX - 1, headY - 1, headW + 2, 12);
    rect(ctx, skin, headX, headY, headW, 10);
    if (char.id === "knight" || char.id === "tank") {
      rect(ctx, "#cbd5e1", headX - 1, headY - 2, headW + 2, 8);
      rect(ctx, "#475569", headX + 1, headY + 5, headW - 2, 4);
      rect(ctx, char.eyeColor, headX + headW - 5, headY + 6, 3, 2);
      if (char.id === "knight") {
        rect(ctx, "#fbbf24", center - 1, 0, 2, 4);
      }
    } else if (char.id === "cyborg") {
      rect(ctx, "#64748b", headX, headY, headW, 10);
      rect(ctx, "#0f172a", headX + 1, headY + 4, headW - 2, 4);
      rect(ctx, "#22d3ee", headX + headW - 6, headY + 5, 4, 2);
    } else if (char.id === "ninja") {
      rect(ctx, "#111827", headX, headY - 1, headW, 11);
      rect(ctx, "#334155", headX + 2, headY + 4, headW - 4, 4);
      rect(ctx, "#fde047", headX + headW - 6, headY + 5, 3, 2);
    } else if (char.id === "ranger") {
      rect(ctx, "#14532d", headX - 1, headY - 2, headW + 2, 5);
      rect(ctx, "#65a30d", headX - 3, headY + 1, headW + 6, 2);
      rect(ctx, "#172554", headX + headW - 5, headY + 4, 2, 2);
    } else if (char.id === "mage") {
      rect(ctx, "#312e81", headX - 1, headY - 1, headW + 2, 5);
      rect(ctx, "#fef08a", headX + headW - 5, headY + 4, 2, 2);
    } else if (char.id === "spirit") {
      rect(ctx, "#ede9fe", headX, headY, headW, 10);
      rect(ctx, "#7c3aed", headX + headW - 6, headY + 4, 3, 3);
      rect(ctx, "rgba(167,139,250,0.55)", headX - 2, headY + 9, headW + 4, 3);
    } else {
      rect(ctx, "#ccfbf1", headX - 1, headY - 2, headW + 2, 5);
      rect(ctx, "#0f766e", center - 1, headY - 3, 2, 5);
      rect(ctx, "#0f766e", center - 3, headY - 1, 6, 2);
      rect(ctx, "#134e4a", headX + headW - 5, headY + 4, 2, 2);
    }
    ctx.strokeStyle = "#0a0a0f";
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.9;
    ctx.strokeRect(0.5, 1.5, width - 1, height - 3);
    ctx.strokeStyle = "#f4f2ed";
    ctx.globalAlpha = 0.75;
    ctx.beginPath();
    ctx.moveTo(1, height - 0.5);
    ctx.lineTo(width - 1, height - 0.5);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  // <stdin>
  window.art = { CHARACTERS, drawCharacterArt, drawOriginalCharacterArt };
})();
</script><script>
const {CHARACTERS,drawCharacterArt,drawOriginalCharacterArt}=window.art;
const poses=[['OLD INK',{},true],['NEW INK',{}],['RUN / REACH',{phase:.25,stride:2.4,moving:true}],['RUN / PASS',{phase:.5,stride:0,moving:true}],['JUMP',{airborne:true,verticalVelocity:-300}],['DASH',{dashing:true}],['ATTACK',{melee:.55}],['AIR + ATTACK',{airborne:true,melee:.55}],['TUMBLE',{airborne:true,tumble:.5}]];
const canvas=document.querySelector('#sheet'),ctx=canvas.getContext('2d');
canvas.width=1530;canvas.height=60+CHARACTERS.length*152;
ctx.fillStyle='#10101c';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#c7ff4d';ctx.font='bold 13px system-ui';
poses.forEach((p,i)=>ctx.fillText(p[0],115+i*157,28));
CHARACTERS.forEach((char,row)=>{const y=44+row*152;ctx.fillStyle='#f4f2ed';ctx.font='bold 13px system-ui';ctx.fillText(char.name,12,y+68);
poses.forEach(([label,pose,old],col)=>{const x=105+col*157;ctx.fillStyle=old?'#211b2b':'#191927';ctx.fillRect(x,y,151,146);ctx.save();ctx.translate(x+60,y+16);ctx.scale(3,3);ctx.translate(-char.width/2,0);(old?drawOriginalCharacterArt:drawCharacterArt)(ctx,char,char.width,char.height,pose);ctx.restore();});});
window.sheetReady=true;
const select=document.querySelector('#character');CHARACTERS.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.append(o)});
let playing=true,elapsed=0,last=performance.now();document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause motion':'Play motion';document.querySelector('#play').setAttribute('aria-pressed',playing)};
const reduce=matchMedia('(prefers-reduced-motion: reduce)');if(reduce.matches)document.querySelector('#play').click();
const live=document.querySelector('#live'),l=live.getContext('2d');
function tick(now){if(playing)elapsed+=Math.min(.05,(now-last)/1000);last=now;const c=CHARACTERS.find(c=>c.id===select.value);const a=document.querySelector('#action').value;const p={time:elapsed,phase:(elapsed*3)%1,stride:a==='run'?Math.sin(elapsed*Math.PI*6)*2.4:0,moving:a==='run',airborne:a.includes('air')||a==='tumble',dashing:a==='dash',melee:a.includes('melee')?(elapsed*1.6)%1:0,ranged:a==='ranged'?(elapsed*1.6)%1:0,tumble:a==='tumble'?(elapsed*.8)%1:0,verticalVelocity:Math.sin(elapsed*3)*400};l.fillStyle='#10101c';l.fillRect(0,0,860,250);for(const [i,draw] of [drawOriginalCharacterArt,drawCharacterArt].entries()){l.fillStyle='#bba6c9';l.font='13px system-ui';l.fillText(i?'REDESIGNED / LIVE MOTION':'ORIGINAL / REFERENCE',i*400+40,22);l.save();l.translate(200+i*400,45);l.scale(5,5);l.translate(-c.width/2,0);draw(l,c,c.width,c.height,p);l.restore()}requestAnimationFrame(tick)}requestAnimationFrame(tick);
